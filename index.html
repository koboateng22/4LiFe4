<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#047857" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>4Life - Recovery support</title>
    <meta name="description" content="AI CBT therapy, an anonymous Global Village and instant emergency help for young people in recovery in Ghana." />
    <meta property="og:title" content="4Life - Recovery support" />
    <meta property="og:description" content="AI CBT therapy, an anonymous Global Village and instant emergency help for young people in recovery in Ghana." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // The saved theme (light, dark or the device's own setting) before anything is drawn, so there is no flash.
      // Same rule as src/lib/theme.ts.
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('4life_user_theme') || 'system'; } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.add(dark ? 'dark' : 'light');
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
      /* Prevent mobile viewport side wobble */
      html, body {
        /* clip (not hidden) so the sticky top bar keeps working */
        overflow-x: hidden !important;
        overflow-x: clip !important;
        width: 100% !important;
        max-width: 100vw !important;
        -webkit-overflow-scrolling: touch;
      }
      /* Opening screen (replaced as soon as the app starts) */
      #splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: #f8faf9; color: #0f172a; font-family: Nunito, ui-rounded, system-ui, sans-serif; }
      #splash svg { animation: splash-breathe 10s ease-in-out infinite; transform-origin: 50% 40%; margin-bottom: 6px; }
      #splash strong { font-size: 22px; font-weight: 800; }
      #splash span { font-size: 15px; color: #475569; }
      @keyframes splash-breathe { 0% { transform: scale(0.94); } 40% { transform: scale(1.06); } 100% { transform: scale(0.94); } }
      html.dark #splash { background: #0b1512; color: #f1f5f9; } html.dark #splash span { color: #94a3b8; }
      @media (prefers-reduced-motion: reduce) { #splash svg { animation: none; } }
      /* If the app hasn't started after 10 s (very slow or broken connection): say so, offer a reload,
         and keep the emergency numbers one tap away. Pure CSS, so it works even when the app's code never arrives. */
      #splash .slow { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 18px; max-width: 320px; text-align: center; opacity: 0; visibility: hidden; animation: splash-slow 0.4s ease 10s forwards; }
      #splash .slow p { margin: 0; font-size: 15px; line-height: 1.5; color: inherit; }
      #splash .slow a { font-weight: 800; color: #be123c; }
      #splash .slow button { min-height: 44px; padding: 0 22px; border: 0; border-radius: 14px; background: #047857; color: #fff; font: inherit; font-weight: 800; font-size: 15px; cursor: pointer; }
      html.dark #splash .slow a { color: #fda4af; }
      @keyframes splash-slow { to { opacity: 1; visibility: visible; } }
    </style>
  </head>
  <body class="font-sans antialiased overflow-x-clip">
    <div id="root" class="w-full max-w-full overflow-x-clip">
      <!-- Opening screen while the app loads: the green ribbon of mental health awareness, breathing -->
      <div id="splash" role="status" aria-label="4Life is opening">
        <svg viewBox="0 0 60 100" width="56" height="94" aria-hidden="true">
          <path d="M15 94 L30 58 C36 44 44 32 42 20 C40 8 20 8 18 20" fill="none" stroke="#047857" stroke-width="11" stroke-linejoin="round" />
          <path d="M18 20 C16 32 24 44 30 58 L45 94" fill="none" stroke="#10b981" stroke-width="11" />
        </svg>
        <strong>4Life</strong>
        <span>Mental health matters</span>
        <div class="slow">
          <p>Still opening. On a slow connection this can take a little longer.</p>
          <button type="button" onclick="location.reload()">Try again</button>
          <p>In danger right now? Call <a href="tel:112">112</a> or <a href="tel:193">193</a> (ambulance).</p>
        </div>
      </div>
      <noscript>
        <p style="margin: 24px auto; max-width: 340px; text-align: center; font: 16px/1.5 system-ui, sans-serif;">
          4Life needs JavaScript to run. In danger right now? Call <a href="tel:112">112</a> or <a href="tel:193">193</a> (ambulance).
        </p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
